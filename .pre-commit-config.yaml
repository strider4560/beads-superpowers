repos:
  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]

  # Markdown linting
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.18.1
    hooks:
      - id: markdownlint-cli2

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [-x]

  # YAML frontmatter validation for skills
  - repo: local
    hooks:
      - id: skill-frontmatter
        name: Skill YAML frontmatter check
        entry: python3 scripts/check-skill-frontmatter.py
        language: system
        pass_filenames: false
        files: skills/.*SKILL\.md$

  # Version/skill count consistency
  - repo: local
    hooks:
      - id: version-sync
        name: Version sync check
        entry: bash scripts/bump-version.sh --check
        language: system
        pass_filenames: false
        files: (package\.json|plugin\.json|marketplace\.json|scripts/pipeline/tier-gate\.sh|scripts/pipeline/graph-lint\.mjs)
      - id: skill-count-guard
        name: Skill count drift guard + structural self-consistency
        entry: bash scripts/check-skill-count.sh
        language: system
        pass_filenames: false
        always_run: true
      - id: convention-sync
        name: Convention blocks guard (check-convention-sync)
        entry: bash scripts/check-convention-sync.sh
        language: system
        pass_filenames: false
        always_run: true

  # Secret/PII scan over tracked plans (spec D6). A hit stops the commit; the
  # remedy is human review of the named lines, never auto-redaction.
  - repo: local
    hooks:
      - id: scan-plan
        name: Plan secret/PII scan (scan-plan)
        entry: bash -c 'rc=0; for f; do bash scripts/scan-plan.sh "$f" || rc=1; done; exit $rc' --
        language: system
        # Everything under plans/, not `*.md` alone: scan-plan greps for text
        # shapes and has no use for the extension, and a secret pasted into a
        # plans/config.json or a plans/notes.txt is the same leak. A file grep
        # will not read as text (a binary) is reported by scan-plan as a
        # `non-text file` finding at exit 1 rather than scanned — grep prints no
        # line numbers for one, so scanning it would score it clean while it
        # carried the secret. The remedy is human: review it, or keep it out of
        # plans/.
        files: ^plans/
